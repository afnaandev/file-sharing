<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P2P File Share</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38;
    --text: #e8eaed; --muted: #9aa0aa; --accent: #4f8cff; --accent-dim: #2c4a85;
    --ok: #3ecf8e; --warn: #e6a23c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px; width: 100%; max-width: 520px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .room-row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] {
    flex: 1; background: #0f1218; border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button.secondary { background: var(--accent-dim); }
  button:disabled { background: #333743; cursor: not-allowed; color: var(--muted); }
  .status {
    font-size: 13px; color: var(--muted); margin: 12px 0; padding: 10px 12px;
    background: #0f1218; border-radius: 8px; border: 1px solid var(--border);
  }
  .status.connected { color: var(--ok); }
  .drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 28px;
    text-align: center; color: var(--muted); margin-top: 16px; cursor: pointer;
    transition: border-color .15s;
  }
  .drop.drag { border-color: var(--accent); color: var(--text); }
  .drop.disabled { opacity: 0.4; cursor: not-allowed; }
  #fileInput { display: none; }
  .transfer {
    margin-top: 14px; background: #0f1218; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
  }
  .transfer .name { font-size: 13px; margin-bottom: 6px; word-break: break-all; }
  .bar-bg { background: #23262f; border-radius: 6px; height: 8px; overflow: hidden; }
  .bar-fg { background: var(--accent); height: 100%; width: 0%; transition: width .1s; }
  .transfer .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  a.dl { color: var(--ok); font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>P2P File Share</h1>
  <div class="sub">Files transfer directly between browsers. Nothing is uploaded to a server.</div>

  <div class="room-row">
    <input id="roomInput" type="text" placeholder="Room code (share this with the other PC)" />
    <button id="genBtn" class="secondary">Generate</button>
  </div>
  <button id="joinBtn" style="width:100%;">Connect</button>

  <div id="status" class="status">Not connected.</div>

  <div id="drop" class="drop disabled">
    Connect first, then drag files here (or click to choose)
    <input id="fileInput" type="file" multiple />
  </div>

  <div id="transfers"></div>

  <div id="diag" style="margin-top:18px;font-size:11px;color:#9aa0aa;word-break:break-word;"></div>
</div>

<script>
// ---- Config ----
// The server serves this page AND handles signaling on the same host/port,
// so we just reuse whatever origin the page was loaded from.
const SIGNALING_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
// If you ever split them onto different hosts, hardcode the signaling one instead, e.g.:
// const SIGNALING_URL = 'wss://your-signaling-server.example.com';

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  // For networks with strict NAT/firewalls, STUN alone isn't enough — add a TURN
  // server here (e.g. from Twilio, Cloudflare, or your own coturn instance):
  // { urls: 'turn:your-turn-server:3478', username: 'user', credential: 'pass' },
];

const CHUNK_SIZE = 256 * 1024; // 256KB — larger chunks = fewer messages = less overhead
const BUFFERED_AMOUNT_LOW_THRESHOLD = 1 * 1024 * 1024; // 1MB
const MAX_BUFFERED_AMOUNT = 8 * 1024 * 1024; // pause sending above this, resume once drained

let ws, pc, dataChannel, isInitiator = false;
const sendQueue = [];
let incomingFile = null;

const $ = (id) => document.getElementById(id);
const statusEl = $('status'), dropEl = $('drop'), fileInput = $('fileInput'), transfersEl = $('transfers');

function setStatus(text, connected = false) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (connected ? ' connected' : '');
}

$('genBtn').onclick = () => {
  $('roomInput').value = Math.random().toString(36).slice(2, 8).toUpperCase();
};

$('joinBtn').onclick = () => {
  const room = $('roomInput').value.trim();
  if (!room) { alert('Enter or generate a room code first.'); return; }
  connect(room);
};

let pendingCandidates = [];

// ---- Diagnostics (shown at the bottom of the page) ----
const BUILD = 'v4-diag';
const diagEl = $('diag');
const candCounts = { host: 0, srflx: 0, relay: 0 };
function renderDiag(extra) {
  const parts = ['build ' + BUILD];
  if (pc) parts.push('conn: ' + pc.connectionState, 'ice: ' + pc.iceConnectionState);
  parts.push('candidates host/srflx/relay: ' + candCounts.host + '/' + candCounts.srflx + '/' + candCounts.relay);
  if (extra) parts.push(extra);
  diagEl.textContent = parts.join(' | ');
}
async function reportPath(conn) {
  try {
    const stats = await conn.getStats();
    let pair;
    stats.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = stats.get(r.selectedCandidatePairId); });
    if (!pair) stats.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) pair = r; });
    if (pair) {
      const l = stats.get(pair.localCandidateId), r = stats.get(pair.remoteCandidateId);
      renderDiag('path: ' + (l && l.candidateType) + ' -> ' + (r && r.candidateType));
    }
  } catch (e) { /* ignore */ }
}
renderDiag();

// Tear down everything from the previous session so nothing stale can
// fire events into the next one.
function cleanup() {
  if (dataChannel) {
    dataChannel.onopen = dataChannel.onmessage = dataChannel.onclose = null;
    try { dataChannel.close(); } catch (e) {}
    dataChannel = null;
  }
  if (pc) {
    pc.onicecandidate = pc.onconnectionstatechange = pc.ondatachannel = null;
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  if (ws) {
    ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null;
    try { ws.close(); } catch (e) {}
    ws = null;
  }
  pendingCandidates = [];
  incomingFile = null;
  candCounts.host = candCounts.srflx = candCounts.relay = 0;
  dropEl.classList.add('disabled');
  renderDiag();
}

async function flushCandidates(conn) {
  const queued = pendingCandidates;
  pendingCandidates = [];
  for (const c of queued) {
    try { await conn.addIceCandidate(c); } catch (e) { /* ignore */ }
  }
}

function connect(room) {
  cleanup();
  setStatus('Connecting to signaling server...');
  const socket = new WebSocket(SIGNALING_URL);
  ws = socket;

  socket.onopen = () => socket.send(JSON.stringify({ type: 'join', room }));

  socket.onerror = () => {
    if (ws === socket) setStatus('Could not reach signaling server. Check SIGNALING_URL / that server.js is running.');
  };

  socket.onmessage = async (event) => {
    if (ws !== socket) return; // message from an old session, ignore
    const msg = JSON.parse(event.data);

    if (msg.type === 'joined') {
      isInitiator = msg.initiator;
      setStatus('In room. Waiting for the other PC to join...');
    }

    if (msg.type === 'room-full') {
      setStatus('That room already has two peers. Try a different code.');
      socket.close();
    }

    if (msg.type === 'ready') {
      setStatus('Peer found. Establishing direct connection...');
      const conn = setupPeerConnection(socket);
      if (isInitiator) {
        dataChannel = conn.createDataChannel('file-transfer');
        setupDataChannel();
        const offer = await conn.createOffer();
        await conn.setLocalDescription(offer);
        if (ws === socket) socket.send(JSON.stringify({ type: 'offer', sdp: offer }));
      }
    }

    if (msg.type === 'offer' && pc) {
      const conn = pc;
      await conn.setRemoteDescription(msg.sdp);
      await flushCandidates(conn);
      const answer = await conn.createAnswer();
      await conn.setLocalDescription(answer);
      if (ws === socket) socket.send(JSON.stringify({ type: 'answer', sdp: answer }));
    }

    if (msg.type === 'answer' && pc) {
      const conn = pc;
      await conn.setRemoteDescription(msg.sdp);
      await flushCandidates(conn);
    }

    if (msg.type === 'ice-candidate') {
      // Candidates can arrive before the handshake is done: queue them until then.
      if (pc && pc.remoteDescription) {
        try { await pc.addIceCandidate(msg.candidate); } catch (e) { /* ignore */ }
      } else {
        pendingCandidates.push(msg.candidate);
      }
    }

    if (msg.type === 'peer-left') {
      cleanup();
      setStatus('The other peer disconnected. Click Connect to start a new session.');
    }
  };
}

function setupPeerConnection(socket) {
  if (pc) { pc.onicecandidate = pc.onconnectionstatechange = pc.ondatachannel = null; try { pc.close(); } catch (e) {} }
  const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  pc = conn;

  conn.onicecandidate = (e) => {
    if (e.candidate) {
      const m = / typ (\w+)/.exec(e.candidate.candidate || '');
      if (m && m[1] in candCounts) candCounts[m[1]]++;
      renderDiag();
    }
    if (e.candidate && ws === socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'ice-candidate', candidate: e.candidate }));
    }
  };

  conn.onconnectionstatechange = () => {
    if (pc !== conn) return; // event from an old, replaced connection
    const state = conn.connectionState;
    console.log('connectionState:', state, 'iceConnectionState:', conn.iceConnectionState);
    renderDiag();
    if (state === 'connected') {
      reportPath(conn);
      setStatus('Connected directly to peer (P2P). Ready to send files.', true);
      dropEl.classList.remove('disabled');
    } else if (state === 'disconnected') {
      // Often temporary in WebRTC and can recover on its own.
      setStatus('Connection unstable, trying to recover...');
    } else if (state === 'failed' || state === 'closed') {
      setStatus('Connection lost.');
      dropEl.classList.add('disabled');
    }
  };

  conn.oniceconnectionstatechange = () => { if (pc === conn) renderDiag(); };

  conn.ondatachannel = (e) => {
    if (pc !== conn) return;
    dataChannel = e.channel;
    setupDataChannel();
  };

  return conn;
}

function setupDataChannel() {
  dataChannel.binaryType = 'arraybuffer';

  dataChannel.onopen = () => {
    setStatus('Connected directly to peer (P2P). Ready to send files.', true);
    dropEl.classList.remove('disabled');
  };

  dataChannel.onmessage = (event) => {
    if (typeof event.data === 'string') {
      const meta = JSON.parse(event.data);
      if (meta.type === 'file-start') {
        incomingFile = {
          name: meta.name, size: meta.size, mime: meta.mime,
          received: 0, chunks: [],
          row: addTransferRow(meta.name, meta.size, 'Receiving'),
        };
      }
      if (meta.type === 'file-end' && incomingFile) {
        finishIncoming(incomingFile, meta.sha256);
        incomingFile = null;
      }
    } else {
      if (!incomingFile) return;
      incomingFile.chunks.push(event.data);
      incomingFile.received += event.data.byteLength;
      const pct = Math.min(100, Math.round((incomingFile.received / incomingFile.size) * 100));
      incomingFile.row.bar.style.width = pct + '%';
      incomingFile.row.metaEl.textContent = `${pct}% received`;
    }
  };
}

async function sha256(buf) {
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// Verify the file arrived complete and unchanged before offering the download.
async function finishIncoming(f, expectedHash) {
  const { bar, metaEl } = f.row;
  if (f.received !== f.size) {
    metaEl.textContent = `Transfer incomplete: got ${f.received} of ${f.size} bytes. Please resend.`;
    return;
  }
  const blob = new Blob(f.chunks, { type: f.mime || 'application/octet-stream' });
  if (expectedHash && crypto.subtle) {
    const actual = await sha256(await blob.arrayBuffer());
    if (actual !== expectedHash) {
      metaEl.textContent = 'File corrupted in transit (checksum mismatch). Please resend.';
      return;
    }
  }
  bar.style.width = '100%';
  const a = document.createElement('a');
  a.className = 'dl';
  a.href = URL.createObjectURL(blob);
  a.download = f.name;
  a.textContent = 'Download ' + f.name;
  metaEl.textContent = 'Done and verified. ';
  metaEl.appendChild(a);
}

function addTransferRow(name, size, label) {
  const div = document.createElement('div');
  div.className = 'transfer';
  div.innerHTML = `
    <div class="name">${name} (${formatBytes(size)})</div>
    <div class="bar-bg"><div class="bar-fg"></div></div>
    <div class="meta">${label}...</div>
  `;
  transfersEl.prepend(div);
  return { bar: div.querySelector('.bar-fg'), metaEl: div.querySelector('.meta') };
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// Files are sent strictly one after another so chunks from different files never interleave.
let sendChain = Promise.resolve();
function enqueueFiles(files) {
  for (const f of files) sendChain = sendChain.then(() => sendFile(f)).catch(console.error);
}

async function sendFile(file) {
  if (!dataChannel || dataChannel.readyState !== 'open') {
    alert('Not connected to a peer yet.');
    return;
  }
  const row = addTransferRow(file.name, file.size, 'Sending');
  dataChannel.send(JSON.stringify({ type: 'file-start', name: file.name, size: file.size, mime: file.type }));
  dataChannel.bufferedAmountLowThreshold = BUFFERED_AMOUNT_LOW_THRESHOLD;

  const chunkSize = Math.min(CHUNK_SIZE, (pc.sctp && pc.sctp.maxMessageSize) || CHUNK_SIZE);
  const startTime = performance.now();
  let offset = 0;
  const buffer = await file.arrayBuffer();
  const hash = crypto.subtle ? await sha256(buffer) : null;

  await new Promise((resolve) => {
    function sendChunks() {
      // Send as fast as possible with no artificial delay — only stop
      // when the channel's own send buffer is genuinely backed up.
      while (offset < buffer.byteLength) {
        if (dataChannel.bufferedAmount > MAX_BUFFERED_AMOUNT) {
          dataChannel.onbufferedamountlow = () => {
            dataChannel.onbufferedamountlow = null;
            sendChunks();
          };
          return;
        }
        const chunk = buffer.slice(offset, offset + chunkSize);
        dataChannel.send(chunk);
        offset += chunk.byteLength;

        const pct = Math.min(100, Math.round((offset / buffer.byteLength) * 100));
        const elapsed = (performance.now() - startTime) / 1000;
        const speed = elapsed > 0 ? (offset / elapsed / (1024 * 1024)).toFixed(1) : '0';
        row.bar.style.width = pct + '%';
        row.metaEl.textContent = `${pct}% sent — ${speed} MB/s`;
      }
      resolve();
    }
    sendChunks();
  });

  dataChannel.send(JSON.stringify({ type: 'file-end', sha256: hash }));
  row.bar.style.width = '100%';
  row.metaEl.textContent = 'Sent';
}

// Drag & drop + click-to-choose
dropEl.addEventListener('click', () => { if (!dropEl.classList.contains('disabled')) fileInput.click(); });
fileInput.addEventListener('change', () => { enqueueFiles([...fileInput.files]); fileInput.value = ''; });

['dragover', 'dragenter'].forEach(evt => dropEl.addEventListener(evt, (e) => {
  e.preventDefault();
  if (!dropEl.classList.contains('disabled')) dropEl.classList.add('drag');
}));
['dragleave', 'drop'].forEach(evt => dropEl.addEventListener(evt, (e) => {
  e.preventDefault();
  dropEl.classList.remove('drag');
}));
dropEl.addEventListener('drop', (e) => {
  if (dropEl.classList.contains('disabled')) return;
  enqueueFiles([...e.dataTransfer.files]);
});
</script>
</body>
</html>
